name = "shared-email-api-dev"
main = "src/index.ts"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]
account_id = "d10c2b1a3d702c710a036bc5a6d0902e"

# ============================================================================
# LOCAL DEV
# ============================================================================

[dev]
port = 9001
host = "127.0.0.1"
inspector_port = 9201

# ============================================================================
# BINDINGS
# ============================================================================

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "00dd9c44924f413ca859ba9ad80b8aa7"

[[ratelimits]]
name = "RATE_LIMITER_MINUTE"
namespace_id = "10030"
simple = { limit = 20, period = 60 }

# ============================================================================
# OBSERVABILITY
# ============================================================================

[observability]
enabled = true

# ============================================================================
# VARIABLES
# ============================================================================
[vars]
ENVIRONMENT = "dev"
AWS_REGION = "ap-south-1"
ALLOWED_ORIGINS = "https://dev.skillpassports.com,https://*.pages.dev"

# Secrets (set via `wrangler secret put`):
# EMAIL_API_KEY                  (shared key for authenticating incoming email requests; must match sso-worker's EMAIL_API_KEY)
# AWS_ACCESS_KEY_ID              (AWS credentials for SES)
# AWS_SECRET_ACCESS_KEY          (AWS credentials for SES)
# DEFAULT_FROM_EMAIL             (default sender email address)
# DEFAULT_FROM_NAME              (default sender name)
# MESSAGECENTRAL_CUSTOMER_ID     (MessageCentral SMS customer ID)
# MESSAGECENTRAL_KEY             (MessageCentral SMS API key)

# ============================================================================
# STAGING — wrangler deploy --env staging
# Deploys as: shared-email-api-staging
# ============================================================================

[env.staging]
name = "shared-email-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
AWS_REGION = "ap-south-1"
ALLOWED_ORIGINS = "https://staging.skillpassports.com,https://*.pages.dev"

# Secrets for staging (set via `wrangler secret put --env staging`):
# EMAIL_API_KEY
# AWS_ACCESS_KEY_ID
# AWS_SECRET_ACCESS_KEY
# DEFAULT_FROM_EMAIL
# DEFAULT_FROM_NAME
# MESSAGECENTRAL_CUSTOMER_ID
# MESSAGECENTRAL_KEY

# ============================================================================
# DEMO — wrangler deploy --env demo
# Deploys as: shared-email-api-demo
# ============================================================================

[env.demo]
name = "shared-email-api-demo"

[env.demo.vars]
ENVIRONMENT = "demo"
AWS_REGION = "ap-south-1"
ALLOWED_ORIGINS = "https://demo.skillpassports.com,https://*.pages.dev"

# Secrets for demo (set via `wrangler secret put --env demo`):
# EMAIL_API_KEY
# AWS_ACCESS_KEY_ID
# AWS_SECRET_ACCESS_KEY
# DEFAULT_FROM_EMAIL
# DEFAULT_FROM_NAME
# MESSAGECENTRAL_CUSTOMER_ID
# MESSAGECENTRAL_KEY

# ============================================================================
# PRODUCTION — wrangler deploy --env production
# Deploys as: shared-email-api-production
# ============================================================================

[env.production]
name = "shared-email-api-production"

[env.production.vars]
ENVIRONMENT = "production"
AWS_REGION = "ap-south-1"
ALLOWED_ORIGINS = "https://skillpassport.rareminds.in,https://www.skillpassport.rareminds.in,https://*.pages.dev"

# Secrets for production (set via `wrangler secret put --env production`):
# EMAIL_API_KEY
# AWS_ACCESS_KEY_ID
# AWS_SECRET_ACCESS_KEY
# DEFAULT_FROM_EMAIL
# DEFAULT_FROM_NAME
# MESSAGECENTRAL_CUSTOMER_ID
# MESSAGECENTRAL_KEY
