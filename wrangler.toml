name = "shared-email-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ============================================================================
# BINDINGS
# ============================================================================

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "9ce4234505744e7e9e9c01a5c1b0b1b0"
preview_id = "c45ac18997334201a93ff4b7605bd877"

[[ratelimits]]
name = "RATE_LIMITER_MINUTE"
namespace_id = "10030"
simple = { limit = 20, period = 60 }

# ============================================================================
# OBSERVABILITY
# ============================================================================

[observability]
enabled = true

# ============================================================================
# VARIABLES
# ============================================================================
[vars]
ENVIRONMENT = "production"
AWS_REGION = "ap-south-1"
