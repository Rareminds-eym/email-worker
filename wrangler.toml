name = "shared-email-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ============================================================================
# ROOT (local `wrangler dev` only — not deployed)
# ============================================================================
# Bindings here are used ONLY when running `wrangler dev` without --env.
# Named environments (development / staging / production) do NOT inherit these.
# Each named env must redeclare every binding it needs.
# ============================================================================

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "c45ac18997334201a93ff4b7605bd877"
preview_id = "afb5bd3fed6244a29f63a9a63a1370d1"

[[ratelimits]]
name = "RATE_LIMITER_MINUTE"
namespace_id = "10010"
simple = { limit = 60, period = 60 }

# ============================================================================
# DEVELOPMENT — deployed as "shared-email-api-dev"
# Deploy:  npm run deploy:development
# ============================================================================

[env.development]
name = "shared-email-api-dev"
vars = { ENVIRONMENT = "development", AWS_REGION = "ap-south-1" }

[[env.development.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "c45ac18997334201a93ff4b7605bd877"
preview_id = "afb5bd3fed6244a29f63a9a63a1370d1"

[[env.development.ratelimits]]
name = "RATE_LIMITER_MINUTE"
namespace_id = "10010"
simple = { limit = 60, period = 60 }

# ============================================================================
# STAGING — deployed as "shared-email-api-staging"
# Deploy:  npm run deploy:staging
#
# IMPORTANT: Before first deploy, create a dedicated KV namespace:
#   wrangler kv namespace create RATE_LIMIT_KV --env staging
# Then replace STAGING_KV_ID and STAGING_KV_PREVIEW_ID below with the output.
# ============================================================================

[env.staging]
name = "shared-email-api-staging"
vars = { ENVIRONMENT = "staging", AWS_REGION = "ap-south-1" }

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "bd5c0a1fa7554a91b6acbff1b345997e"

[[env.staging.ratelimits]]
name = "RATE_LIMITER_MINUTE"
namespace_id = "10020"
simple = { limit = 60, period = 60 }

# ============================================================================
# PRODUCTION — deployed as "shared-email-api-production"
# Deploy:  npm run deploy:production
#
# IMPORTANT: Before first deploy, create a dedicated KV namespace:
#   wrangler kv namespace create RATE_LIMIT_KV --env production
# Then replace PRODUCTION_KV_ID below with the output. No preview_id needed.
# ============================================================================

[env.production]
name = "shared-email-api-production"
vars = { ENVIRONMENT = "production", AWS_REGION = "ap-south-1" }

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "9ce4234505744e7e9e9c01a5c1b0b1b0"

[[env.production.ratelimits]]
name = "RATE_LIMITER_MINUTE"
namespace_id = "10030"
simple = { limit = 60, period = 60 }

# ============================================================================
# OBSERVABILITY
# ============================================================================

[observability]
enabled = true
